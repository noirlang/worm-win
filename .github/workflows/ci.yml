name: Windows Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows agent
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        run: python -m py_compile windows.py

      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name amele-win windows.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/amele-win.exe")) {
            throw "dist/amele-win.exe was not created"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: amele-win-x64
          path: dist/amele-win.exe
          if-no-files-found: error
